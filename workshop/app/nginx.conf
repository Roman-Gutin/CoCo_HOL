server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        # SPA fallback: try the file, then directory, then index.html
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy Snowflake API calls (same path as Vite dev proxy)
    location /api/snowflake/ {
        proxy_pass https://rnrizgx-demo-temp.snowflakecomputing.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host rnrizgx-demo-temp.snowflakecomputing.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        # SSE support for streaming agent responses
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # Health check endpoint for SPCS readiness probe
    location /healthcheck {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
